services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflux
      POSTGRES_PASSWORD: leadflux
      POSTGRES_DB: leadflux
    ports:
      - "5432:5432"
    volumes:
      - leadflux-postgres-data:/var/lib/postgresql/data

  # Faux serveur SMTP + IMAP pour tester en local la detection de reponse
  # (statut "A repondu"), sans toucher a une vraie boite Gmail. Ephemere :
  # aucune persistance, les messages disparaissent a l'arret du conteneur.
  # Reserve a ce seul usage IMAP (features/smtp/tests/imap-reply-detection.e2e.ts) :
  # l'envoi applicatif normal passe par maildev, pas par greenmail.
  greenmail:
    image: greenmail/standalone:latest
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=${IMAP_TEST_USER}:${IMAP_TEST_PASS} -Dgreenmail.verbose
    ports:
      - "3025:3025" # SMTP de test
      - "3143:3143" # IMAP de test

  roundcube:
    image: roundcube/roundcubemail:latest
    depends_on:
      - greenmail
    ports:
      - 8334:80
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=greenmail
      - ROUNDCUBEMAIL_DEFAULT_PORT=3143
      - ROUNDCUBEMAIL_SMTP_SERVER=greenmail
      - ROUNDCUBEMAIL_SMTP_PORT=3025

  # Capture tout email sortant de l'app (mode brouillon/test local) dans une
  # seule UI web, quel que soit le destinataire : pas de notion de boite par
  # compte comme greenmail, donc pas besoin de redirection cote code.
  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - "1080:1080" # UI web
      - "1025:1025" # SMTP
volumes:
  leadflux-postgres-data:
